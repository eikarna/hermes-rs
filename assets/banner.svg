<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="55%" stop-color="#e5a93b"/>
      <stop offset="100%" stop-color="#c87a1d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077aa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e2a3a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#04070a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0d2230" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="#060b10"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.45"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- circuit traces -->
  <g stroke="url(#cyan)" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M0 120 H180 L220 160 H400"/>
    <path d="M1280 140 H1080 L1040 180 H900"/>
    <path d="M0 520 H240 L280 480 H440"/>
    <path d="M1280 500 H1060 L1020 460 H880"/>
    <circle cx="400" cy="160" r="4" fill="#00f0ff"/>
    <circle cx="900" cy="180" r="4" fill="#00f0ff"/>
    <circle cx="440" cy="480" r="4" fill="#00f0ff"/>
    <circle cx="880" cy="460" r="4" fill="#00f0ff"/>
  </g>

  <!-- binary rain hints -->
  <g fill="#0f3a4a" font-family="monospace" font-size="13" opacity="0.45">
    <text x="60" y="80">1 0 1 1 0 0 1</text>
    <text x="1080" y="90">0 1 1 0 1 0</text>
    <text x="90" y="590">0 1 0 0 1 1</text>
    <text x="1050" y="580">1 1 0 1 0 0 1</text>
  </g>

  <!-- winged herald emblem -->
  <g transform="translate(640 195)" filter="url(#soft)">
    <!-- left wing -->
    <path d="M-46 -6 C-130 -14 -200 -52 -240 -98 C-182 -72 -126 -62 -74 -58 C-116 -78 -156 -108 -176 -144 C-124 -112 -72 -92 -32 -82 Z"
          fill="url(#cyan)" opacity="0.9"/>
    <!-- right wing -->
    <path d="M46 -6 C130 -14 200 -52 240 -98 C182 -72 126 -62 74 -58 C116 -78 156 -108 176 -144 C124 -112 72 -92 32 -82 Z"
          fill="url(#cyan)" opacity="0.9"/>
    <!-- helmet dome -->
    <path d="M-56 -24 C-56 -86 56 -86 56 -24 L56 16 C56 34 -56 34 -56 16 Z" fill="#12303f" stroke="#00f0ff" stroke-width="2.5"/>
    <rect x="-56" y="-8" width="112" height="11" rx="2" fill="#00f0ff" opacity="0.95"/>
  </g>

  <!-- title -->
  <text x="640" y="390" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-weight="bold" font-size="132" letter-spacing="16" fill="url(#gold)" filter="url(#soft)">KERUX</text>

  <!-- greek subtitle -->
  <text x="640" y="442" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="27" letter-spacing="5" fill="#7fd8e8" filter="url(#soft)">κῆρυξ · messenger of the gods</text>

  <!-- tagline -->
  <text x="640" y="508" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-weight="bold" font-size="31" letter-spacing="4" fill="#ffffff" filter="url(#soft)">FAST · SELF-CONTAINED · RUST</text>

  <!-- frame -->
  <rect x="14" y="14" width="1252" height="612" fill="none" stroke="url(#cyan)" stroke-width="2" opacity="0.8"/>
  <g stroke="#00f0ff" stroke-width="3" fill="none" opacity="0.9">
    <path d="M14 54 V14 H54"/><path d="M1226 14 H1266 V54"/>
    <path d="M1266 586 V626 H1226"/><path d="M54 626 H14 V586"/>
  </g>
</svg>
