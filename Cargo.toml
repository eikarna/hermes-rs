[workspace]
resolver = "2"
members = [
    "crates/kerux-core",
    "crates/kerux-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["eikarna"]
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"

# Networking
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
config = { version = "0.14", default-features = false, features = ["toml"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
indicatif = "0.17"
dirs = "5.0"
toml = "0.8"
toml_edit = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
futures = "0.3"
pin-project = "1.1"
bytes = "1.6"
futures-util = "0.3"
getrandom = "0.2"
sha2 = "0.10"

# Terminal UI
ratatui = "=0.28.1"
crossterm = "0.28"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
