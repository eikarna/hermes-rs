[workspace]
resolver = "2"
members = [
    "crates/hermes-core",
    "crates/hermes-cli",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
authors = ["eikarna"]
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
config = { version = "0.14", default-features = false, features = ["toml"] }
dirs = "5.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
pin-project = "1.1"
bytes = "1.6"
futures-util = "0.3"
ratatui = "=0.28.1"
crossterm = "0.28"
unicode-width = "0.2"
criterion = "0.5"

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
