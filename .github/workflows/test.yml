name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Run tests (debug/info)
        run: |
          echo "Running on OS: ${{ matrix.os }}"
          uname -a || ver
          whoami || whoami

      - name: Run tests (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "/tmp/cargo-target"
          New-Item -ItemType Directory -Force -Path "/tmp/cargo-target" | Out-Null
          cargo test --workspace --all-features

      - name: Run tests (unix)
        if: matrix.os != 'windows-latest'
        run: |
          export CARGO_TARGET_DIR=/tmp/cargo-target
          mkdir -p /tmp/cargo-target
          cargo test --workspace --all-features

      - name: Run tests (release windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "/tmp/cargo-target"
          New-Item -ItemType Directory -Force -Path "/tmp/cargo-target" | Out-Null
          cargo test --workspace --all-features --release

      - name: Run tests (release unix)
        if: matrix.os != 'windows-latest'
        run: |
          export CARGO_TARGET_DIR=/tmp/cargo-target
          mkdir -p /tmp/cargo-target
          cargo test --workspace --all-features --release

      - name: Cleanup target directory
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Cleanup temporary target directory to free up space
          Remove-Item -Recurse -Force -Path "/tmp/cargo-target" -ErrorAction SilentlyContinue

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --workspace --all-features --out xml --output-dir coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/cobertura.xml
