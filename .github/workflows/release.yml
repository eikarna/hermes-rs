name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag from build run
        id: tag
        shell: bash
        run: |
          git fetch --force --tags
          TAG=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | head -n 1)
          if [ -z "$TAG" ]; then
            echo "No tag points at ${{ github.event.workflow_run.head_sha }}. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts
          gh run download "${{ github.event.workflow_run.id }}" --dir artifacts

      - name: Extract release notes from changelog
        if: steps.tag.outputs.skip != 'true'
        id: notes
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          tag = "${{ steps.tag.outputs.tag }}"
          version = tag.lstrip("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\] - .*$([\s\S]*?)(?=^## \[|\Z)"
          match = re.search(pattern, changelog, flags=re.MULTILINE)
          if not match:
              print(f"Version {version} not found in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY

      - name: Append contributor credits
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, subprocess

          tag = "${{ steps.tag.outputs.tag }}"
          repo = "${{ github.repository }}"
          BOTS = {"imgbot", "imgbot[bot]", "dependabot[bot]", "github-actions[bot]", "web-flow"}

          def gh(*args):
              r = subprocess.run(["gh", "api", *args], capture_output=True, text=True)
              if r.returncode != 0:
                  return None
              try:
                  return json.loads(r.stdout)
              except json.JSONDecodeError:
                  return None

          # previous tag by version sort
          out = subprocess.run(["git", "tag", "--sort=-v:refname"], capture_output=True, text=True).stdout.split()
          prev = next((t for t in out if t != tag), None)

          if prev:
              data = gh(f"repos/{repo}/compare/{prev}...{tag}")
              commits = (data or {}).get("commits", [])
          else:
              commits = gh(f"repos/{repo}/commits?sha={tag}&per_page=100") or []

          contributors = []
          for c in commits:
              author = c.get("author") or {}
              login = author.get("login")
              if login and login not in BOTS and login not in contributors:
                  contributors.append(login)

          new = []
          if prev:
              for login in contributors:
                  prior = gh(f"repos/{repo}/commits?author={login}&sha={prev}&per_page=1")
                  if prior == []:
                      new.append(login)

          notes = pathlib.Path("release_notes.md").read_text(encoding="utf-8").rstrip()
          sections = []
          if contributors:
              lines = " ".join(f"[@{l}](https://github.com/{l})" for l in contributors)
              sections.append(f"## Contributors\n\n{lines}")
          if new:
              lines = "\n".join(f"* [@{l}](https://github.com/{l}) made their first contribution" for l in new)
              sections.append(f"## New Contributors\n\n{lines}")
          if sections:
              notes += "\n\n" + "\n\n".join(sections) + "\n"
          pathlib.Path("release_notes.md").write_text(notes, encoding="utf-8")
          print(f"contributors={contributors} new={new}")
          PY

      - name: Publish GitHub release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          find artifacts -type f | sort > artifact_list.txt
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ steps.tag.outputs.tag }}" --notes-file release_notes.md
            while IFS= read -r file; do
              gh release upload "${{ steps.tag.outputs.tag }}" "$file" --clobber
            done < artifact_list.txt
          else
            gh release create "${{ steps.tag.outputs.tag }}" \
              --title "${{ steps.tag.outputs.tag }}" \
              --notes-file release_notes.md \
              $(cat artifact_list.txt)
          fi
